version: "3.8"

services:
  sangati:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sangati
    ports:
      - "8000:8000"
    volumes:
      - sangati-data:/app/data
    environment:
      - DEMO_MODE=true
      - DEBUG=false
      - SIGNAL_TICK_INTERVAL=5.0
      - CORS_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sangati-data:
    driver: local
