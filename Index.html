<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sangati | One AI. Total Harmony.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body{background:#050810;color:#e2e8f0;font-family:Manrope,sans-serif;overflow-x:hidden}
        .serif{font-family:'Cormorant Garamond',serif}
        .glass{background:rgba(5,8,16,.7);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}
        .btn{padding:1.25rem 3rem;background:#FF7F50;transition:all 0.3s;border-radius:.75rem}
        .btn:hover{background:#ff6b36}
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const {useState, useEffect} = React;
        const showToast=(m,t='info')=>{const c={'success':'#29F58C','error':'#FF495C','info':'#2EE4FF'}[t];const d=document.createElement('div');d.textContent=m;d.style=`position:fixed;bottom:2rem;right:2rem;padding:1rem 1.5rem;background:${c};color:black;border-radius:.5rem;z-index:1000;font-weight:bold`;document.body.appendChild(d);setTimeout(()=>d.remove(),4000)};

        const Login=({open,close,login})=>{const [u,setU]=useState(''),[p,setP]=useState('');if(!open)return null;return <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4"><div className="glass w-full max-w-sm p-10 rounded-2xl text-center"><h2 className="text-3xl serif text-white mb-8">Admin Access</h2>
        <form onSubmit={e=>{e.preventDefault();u==='prasadmehta'&&p==='admin888'?login():showToast('Access Denied','error')}} className="space-y-6">
        <input placeholder="Username" value={u} onChange={e=>setU(e.target.value)} className="w-full p-4 rounded-lg bg-white/5 border border-white/10 focus:border-[#FF7F50] outline-none text-white" required/>
        <input type="password" placeholder="Password" value={p} onChange={e=>setP(e.target.value)} className="w-full p-4 rounded-lg bg-white/5 border border-white/10 focus:border-[#FF7F50] outline-none text-white" required/>
        <button type="submit" className="w-full btn text-white uppercase tracking-widest font-bold">Enter System</button></form></div></div>};

        const Dashboard=({out})=>{const [load,setLoad]=useState({grill:72,prep:45,pack:88,assembly:63}),[wins,setWins]=useState([{e:"Auto-nuked Pack jam",t:"Just now",v:"₹150"}]);
        useEffect(()=>{const i=setInterval(()=>{setLoad(l=>{const n={...l};if(n.pack>85){n.pack=Math.max(40,n.pack-30);setWins(w=>[{e:`Auto-nuked Pack jam`,t:"Just now",v:"₹150"},...w]);showToast("AI fixed Pack jam","success")}return n})},8000);return()=>clearInterval(i)},[]);
        return <div className="min-h-screen p-8"><header className="glass p-6 mb-8 flex justify-between"><h1 className="text-4xl serif text-white">Sangati Admin</h1><button onClick={out} className="px-8 py-3 border border-[#FF7F50] text-[#FF7F50] hover:bg-[#FF7F50] hover:text-black rounded-lg transition">Logout</button></header>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-6">{Object.entries(load).map(([s,l])=>(
        <div key={s} className={`glass rounded-xl p-6 text-center border-t-4 ${l>=85?'border-red-500':l>=70?'border-yellow-500':'border-green-500'}`}>
        <h3 className="capitalize text-xl mb-2">{s}</h3><p className="text-5xl font-bold">{l}%</p>
        <p className={`text-sm mt-2 ${l>=85?'text-red-400':l>=70?'text-yellow-400':'text-green-400'}`}>{l>=85?"JAM":l>=70?"WATCH":"SMOOTH"}</p></div>))}</div>
        <div className="mt-12"><h2 className="text-3xl serif text-white mb-6">AI Wins Today</h2>
        {wins.map((w,i)=><div key={i} className="glass p-4 rounded-lg mb-4 border-l-4 border-green-500"><p>{w.e}</p><p className="text-xs text-slate-400">{w.t} • <span className="text-green-400 font-bold">+{w.v}</span></p></div>)}</div></div>};

        const App=()=>{const [in,setIn]=useState(false),[login,setLogin]=useState(false);return in?<Dashboard out={()=>setIn(false)}/>:
        <div className="min-h-screen flex flex-col items-center justify-center text-center px-6 bg-gradient-to-br from-[#050810] to-[#0a0f1e]">
        <h1 className="text-6xl md:text-8xl serif text-white mb-8">Sangati</h1>
        <p className="text-2xl text-slate-400 mb-12">One AI. Total Harmony.</p>
        <button onClick={()=>setLogin(true)} className="px-16 py-6 bg-[#FF7F50] hover:bg-[#ff6b36] text-white text-2xl rounded-xl uppercase tracking-widest font-bold">Admin Login</button>
        <Login open={login} close={()=>setLogin(false)} login={()=>setIn(true)}/></div>};
        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
